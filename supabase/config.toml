# Supabase project configuration for the Alpha platform backend.
# Run: supabase link --project-ref <ref> && supabase db push && supabase functions deploy
project_id = "alpha-platform"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 15

[studio]
enabled = true

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/account",
  "https://alpha-ai-workspace.vercel.app/account",
  "alpha://auth/callback"
]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 6

# The gateway verifies the caller's JWT itself (auth.getUser) so it can return
# structured JSON errors instead of a generic 401.
[functions.ai-gateway]
verify_jwt = false
